<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShivOS | System Changelog</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        .page-header {
            padding: 8rem 5% 4rem;
            text-align: center;
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 1rem;
        }

        .timeline-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5% 6rem;
            position: relative;
        }

        /* Timeline Vertical Line */
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 5%;
            width: 2px;
            background: var(--glass-border);
            margin-left: 20px;
        }

        @media (min-width: 768px) {
            .timeline-container::before {
                left: 140px;
                margin-left: 0;
            }
        }

        .timeline-item {
            position: relative;
            margin-bottom: 3rem;
        }

        @media (min-width: 768px) {
            .timeline-item {
                display: flex;
                align-items: flex-start;
            }
        }

        /* Timeline Date & Marker */
        .timeline-date {
            display: none;
        }

        .timeline-marker {
            position: absolute;
            left: 12px;
            top: 24px;
            width: 18px;
            height: 18px;
            background: var(--bg-dark);
            border: 4px solid var(--accent-orange);
            border-radius: 50%;
            z-index: 2;
        }

        @media (min-width: 768px) {
            .timeline-date {
                display: block;
                width: 140px;
                padding-right: 2rem;
                padding-top: 1.5rem;
                text-align: right;
                font-weight: 600;
                color: var(--text-muted);
                flex-shrink: 0;
            }
            .timeline-marker {
                left: 132px;
                top: 1.6rem;
            }
        }

        /* Timeline Card */
        .timeline-content {
            margin-left: 50px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: var(--glass-blur);
            flex: 1;
        }

        @media (min-width: 768px) {
            .timeline-content {
                margin-left: 2rem;
            }
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .timeline-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .timeline-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .timeline-badge {
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64;
            border: 1px solid #00ff64;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .changelog-notes {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 0.95rem;
            white-space: pre-wrap; /* Preserves newlines from the Admin textarea */
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">Shiv<span>OS</span></div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/downloads.html">Downloads</a>
            <a href="/changelog.html" style="color: var(--text-main);">Changelog</a>
            <a href="/docs.html">Documentation</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>System Changelog</h1>
        <p class="text-muted">Global version history, new features, and bug fixes.</p>
    </header>

    <main>
        <div class="timeline-container" id="changelog-container">
            <div style="text-align: center; color: var(--text-muted); padding: 2rem;">
                Fetching global changelog...
            </div>
        </div>
    </main>

    <script type="module" src="content.js"></script>
</body>
</html>
