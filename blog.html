<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShivOS | Blog & News</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        .page-header {
            padding: 8rem 5% 4rem;
            text-align: center;
            background: radial-gradient(circle at 50% 0%, rgba(255, 107, 0, 0.1) 0%, transparent 60%);
        }

        .page-header h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 1rem;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            padding: 0 5% 6rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .blog-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: var(--glass-blur);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.1);
        }

        .blog-image {
            width: 100%;
            height: 200px;
            background-color: rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .blog-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .blog-category {
            background: rgba(255, 107, 0, 0.15);
            color: var(--accent-orange);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .blog-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .blog-excerpt {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .read-more {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .read-more:hover {
            color: var(--text-main);
            gap: 0.75rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">Shiv<span>OS</span></div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/downloads.html">Downloads</a>
            <a href="/docs.html">Documentation</a>
            <a href="/blog.html" style="color: var(--text-main);">Blog</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>News & Updates</h1>
        <p class="text-muted">The latest announcements, development progress, and ecosystem news.</p>
    </header>

    <main>
        <div class="blog-grid" id="blog-container">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
                Loading latest posts...
            </div>
        </div>
    </main>

    <script type="module" src="content.js"></script>
</body>
</html>
